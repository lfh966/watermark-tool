    const stitchCopyBtn   = document.querySelector("#stitchCopy");

    const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp" };
    const supportsFolderPicker = typeof window.showDirectoryPicker === "function";
    const supportsClipboard    = !!(navigator.clipboard && window.ClipboardItem);

    const STITCH_MAX_DIM  = 32000;
    const STITCH_MAX_AREA = 200000000;

    /* ================================================================
     * 状态
     * ================================================================ */
    const controls = {
      watermark: document.querySelector("#watermark"),
      size:      document.querySelector("#size"),
      opacity:   document.querySelector("#opacity"),
      color:     document.querySelector("#color"),
      font:      document.querySelector("#font"),
      bold:      document.querySelector("#bold"),
      stroke:    document.querySelector("#stroke"),
      rotate:    document.querySelector("#rotate"),
      spacing:   document.querySelector("#spacing"),
      margin:    document.querySelector("#margin")
    };

    const images = [];
    let selectedIndex = -1;
    let mode = "tile";
    let position = "mc";
    let exportMode = "zip";
    let directoryHandle = null;
    let nativeFolderPath = null;

    let currentTool = "none";
    let drawing = null;

    let stitchDir = "vertical";
    let stitchFit = "uniform";

    /* ================================================================
     * 标签刷新
     * ================================================================ */
    function updateLabels() {
      document.querySelector("#sizeValue").textContent    = `${controls.size.value} px`;
      document.querySelector("#opacityValue").textContent = `${controls.opacity.value}%`;
      document.querySelector("#spacingValue").textContent = `${controls.spacing.value} px`;
      document.querySelector("#rotateValue").textContent  = `${controls.rotate.value}°`;
      document.querySelector("#marginValue").textContent  = `${controls.margin.value} px`;
      document.querySelector("#qualityValue").textContent = `${qualityRange.value}%`;
      document.querySelector("#stitchGapValue").textContent = `${stitchGap.value} px`;
    }

    function updateAnnoLabels() {
      anno.widthV.textContent   = anno.width.value;
      anno.fontV.textContent    = anno.font.value;
      anno.opacityV.textContent = `${anno.opacity.value}%`;
    }

    /* ================================================================
     * 标注绘制
     * ================================================================ */
    function drawArrow(context, from, to, lineWidth) {
      const headLen = Math.max(10, lineWidth * 3.2);
      const angle = Math.atan2(to.y - from.y, to.x - from.x);

      context.beginPath();
      context.moveTo(from.x, from.y);
      context.lineTo(to.x, to.y);
      context.stroke();

      context.beginPath();
      context.moveTo(to.x, to.y);
      context.lineTo(
        to.x - headLen * Math.cos(angle - 0.45),
        to.y - headLen * Math.sin(angle - 0.45)
      );
      context.lineTo(
        to.x - headLen * Math.cos(angle + 0.45),
        to.y - headLen * Math.sin(angle + 0.45)
      );
      context.closePath();
      context.fill();
    }

    function drawMosaic(context, pts, lineWidth, scale) {
      const cw = context.canvas.width;
      const ch = context.canvas.height;

      const x0 = Math.max(0, Math.floor(Math.min(pts[0].x, pts[1].x)));
      const y0 = Math.max(0, Math.floor(Math.min(pts[0].y, pts[1].y)));
      const x1 = Math.min(cw, Math.ceil(Math.max(pts[0].x, pts[1].x)));
      const y1 = Math.min(ch, Math.ceil(Math.max(pts[0].y, pts[1].y)));

      const w = x1 - x0;
      const h = y1 - y0;
      if (w < 3 || h < 3) return;

      const block = Math.max(4, Math.round(lineWidth * 3 * scale));

      try {
        const imageData = context.getImageData(x0, y0, w, h);
        const px = imageData.data;

        for (let by = 0; by < h; by += block) {
          const bh = Math.min(block, h - by);
          for (let bx = 0; bx < w; bx += block) {
            const bw = Math.min(block, w - bx);

            let r = 0, g = 0, b = 0, n = 0;
            for (let y = by; y < by + bh; y++) {
              for (let x = bx; x < bx + bw; x++) {
                const i = (y * w + x) * 4;
                r += px[i];
                g += px[i + 1];
                b += px[i + 2];
                n++;
              }
            }
            r /= n; g /= n; b /= n;

            for (let y = by; y < by + bh; y++) {
              for (let x = bx; x < bx + bw; x++) {
                const i = (y * w + x) * 4;
                px[i]     = r;
                px[i + 1] = g;
                px[i + 2] = b;
              }
            }
          }
        }

        context.putImageData(imageData, x0, y0);
      } catch (error) {
        /* 跨域或尺寸异常时静默跳过 */
      }
    }

    function drawAnnotation(context, a, scale) {
      const pts = a.points;
      if (!pts || !pts.length) return;

      const lineWidth = Math.max(1, a.lineWidth * scale);

      context.save();
      context.globalAlpha = a.opacity;
      context.strokeStyle = a.color;
      context.fillStyle   = a.color;
      context.lineWidth   = lineWidth;
      context.lineCap     = "round";
      context.lineJoin    = "round";

      switch (a.type) {
        case "rect": {
          const x = Math.min(pts[0].x, pts[1].x);
          const y = Math.min(pts[0].y, pts[1].y);
          const w = Math.abs(pts[1].x - pts[0].x);
          const h = Math.abs(pts[1].y - pts[0].y);
          if (a.fill) context.fillRect(x, y, w, h);
          else context.strokeRect(x, y, w, h);
          break;
        }

        case "ellipse": {
          const x = Math.min(pts[0].x, pts[1].x);
          const y = Math.min(pts[0].y, pts[1].y);
          const w = Math.abs(pts[1].x - pts[0].x);
          const h = Math.abs(pts[1].y - pts[0].y);
          if (w < 1 || h < 1) break;
          context.beginPath();
          context.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
          if (a.fill) context.fill();
          else context.stroke();
          break;
        }

        case "line": {
          context.beginPath();
          context.moveTo(pts[0].x, pts[0].y);
          context.lineTo(pts[1].x, pts[1].y);
          context.stroke();
          break;
        }

        case "arrow": {
          drawArrow(context, pts[0], pts[1], lineWidth);
          break;
        }

        case "pen": {
          if (pts.length < 2) break;
          context.beginPath();
          context.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            context.lineTo(pts[i].x, pts[i].y);
          }
          context.stroke();
          break;
        }

        case "mosaic": {
          drawMosaic(context, pts, a.lineWidth, scale);
          break;
        }

        case "text": {
          const fontSize = Math.max(10, a.fontSize * scale);
          context.font = `600 ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
          context.textAlign = "left";
          context.textBaseline = "top";
          context.lineWidth = Math.max(1, fontSize / 12);
          context.strokeStyle = "rgba(0,0,0,0.45)";
          context.strokeText(a.text, pts[0].x, pts[0].y);
          context.fillText(a.text, pts[0].x, pts[0].y);
          break;
        }
      }

      context.restore();
    }

    function drawAnnotations(context, annotations, targetWidth) {
      if (!annotations || !annotations.length) return;
      const scale = targetWidth / 1000;
      annotations.forEach(a => drawAnnotation(context, a, scale));
    }

    /* ================================================================
     * 水印 + 标注合成
     * ================================================================ */
    function drawWatermark(target, image, options = {}) {
      const context = target.getContext("2d");
      target.width  = image.naturalWidth;
      target.height = image.naturalHeight;

      if (options.background) {
        context.fillStyle = options.background;
        context.fillRect(0, 0, target.width, target.height);
      }
      context.drawImage(image, 0, 0);

      const text = controls.watermark.value.trim();

      if (text) {
        const scale    = target.width / 1000;
        const fontSize = Math.max(12, Number(controls.size.value) * scale);
        const angle    = Number(controls.rotate.value) * Math.PI / 180;
        const weight   = controls.bold.checked ? 700 : 400;

        context.save();
        context.font         = `${weight} ${fontSize}px ${controls.font.value}`;
        context.globalAlpha  = Number(controls.opacity.value) / 100;
        context.fillStyle    = controls.color.value;
        context.textAlign    = "center";
        context.textBaseline = "middle";

        const paint = (x, y) => {
          if (controls.stroke.checked) {
            context.lineWidth   = Math.max(1, fontSize / 14);
            context.strokeStyle = "rgba(0,0,0,0.45)";
            context.strokeText(text, x, y);
          }
          context.fillText(text, x, y);
        };

        if (mode === "single") {
          const pad = Number(controls.margin.value) * scale;
          const row = position[0];
          const col = position[1];

          const x = col === "l" ? pad : col === "r" ? target.width - pad : target.width / 2;
          const y = row === "t" ? pad : row === "b" ? target.height - pad : target.height / 2;

          context.textAlign    = { l: "left",   c: "center", r: "right"  }[col];
          context.textBaseline = { t: "top",    m: "middle", b: "bottom" }[row];

          context.translate(x, y);
          context.rotate(angle);
          paint(0, 0);
        } else {
          const spacing = Number(controls.spacing.value) * scale;
          const stepX   = Math.max(spacing, context.measureText(text).width + 40);
          const stepY   = Math.max(spacing, fontSize * 3);
          const extent  = Math.hypot(target.width, target.height);

          context.translate(target.width / 2, target.height / 2);
          context.rotate(angle);

          for (let y = -extent; y <= extent; y += stepY) {
            for (let x = -extent; x <= extent; x += stepX) {
              paint(x, y);
            }
          }
        }

        context.restore();
      }

      drawAnnotations(context, options.annotations, target.width);
    }

    /* ================================================================
     * 预览
     * ================================================================ */
    let rafId = 0;
    function renderPreview() {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        const item = images[selectedIndex];
        if (!item) {
          canvas.style.display = "none";
          emptyHint.hidden = false;
          return;
        }

        const list = item.annotations.slice();
        if (drawing) list.push(drawing);

        drawWatermark(canvas, item.image, { annotations: list });
        canvas.style.display = "block";
        emptyHint.hidden = true;
      });
    }

    /* ================================================================
     * 文件列表
     * ================================================================ */
    function renderList() {
      const fragment = document.createDocumentFragment();

      images.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `file-item${index === selectedIndex ? " selected" : ""}`;
        row.tabIndex = 0;
        row.title = `${item.file.name}（${item.image.naturalWidth}×${item.image.naturalHeight}）`;

        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.src = item.url;
        thumb.alt = "";

        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = item.file.name;

        const dims = document.createElement("span");
        dims.className = "file-size";
        dims.textContent = `${item.image.naturalWidth}×${item.image.naturalHeight}`;
        name.append(dims);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "移除这张图片";
        remove.addEventListener("click", event => {
          event.stopPropagation();
          URL.revokeObjectURL(item.url);
          images.splice(index, 1);
          if (selectedIndex >= images.length) selectedIndex = images.length - 1;
          drawing = null;
          renderList();
          renderPreview();
          updateCount();
          updateActionButtons();
          updateEditorState();
        });

        const select = () => {
          selectedIndex = index;
          drawing = null;
          renderList();
          renderPreview();
          updateActionButtons();
          updateEditorState();
        };

        row.addEventListener("click", select);
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            select();
          }
        });

        row.append(thumb, name, remove);
        fragment.append(row);
      });

      fileList.replaceChildren(fragment);
    }

    function updateCount() {
      countLabel.textContent = images.length ? `${images.length} 张图片` : "未选择图片";
    }

    function updateActionButtons() {
      const hasImages = images.length > 0;
      const hasCurrent = selectedIndex >= 0 && !!images[selectedIndex];

      downloadBtn.disabled = !hasImages;
      downloadOneBtn.disabled = !hasCurrent;
      downloadOneMini.disabled = !hasCurrent;
      copyOneBtn.disabled = !hasCurrent;
      copyOneMini.disabled = !hasCurrent;

      updateStitchInfo();
    }

    /* ================================================================
     * 编辑区状态
     * ================================================================ */
    function updateEditorState() {
      const item = images[selectedIndex];
      const count = item ? item.annotations.length : 0;

      annoCountEl.textContent = `${count} 个`;

      undoBtn.disabled      = !item || count === 0;
      redoBtn.disabled      = !item || item.redo.length === 0;
      clearAnnoBtn.disabled = !item || count === 0;

      canvas.classList.toggle("editing", currentTool !== "none" && !!item);
    }

    function setTool(tool) {
      currentTool = tool;
      drawing = null;

      editorTools.querySelectorAll("[data-tool]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tool === tool);
      });

      const isText = tool === "text";
      const isNone = tool === "none";

      widthOpt.hidden = isText || isNone;
      fontOpt.hidden  = !isText;
      textOpt.hidden  = !isText;
      fillOpt.hidden  = isNone || isText || tool === "pen" ||
                        tool === "line" || tool === "arrow" || tool === "mosaic";

      updateEditorState();
      renderPreview();
    }

    /* ================================================================
     * 撤销 / 重做
     * ================================================================ */
    function undoAnnotation() {
      const item = images[selectedIndex];
      if (!item || !item.annotations.length) return;
      item.redo.push(item.annotations.pop());
      drawing = null;
      renderPreview();
      updateEditorState();
      statusEl.textContent = "已撤销一步标注。";
    }

    function redoAnnotation() {
      const item = images[selectedIndex];
      if (!item || !item.redo.length) return;
      item.annotations.push(item.redo.pop());
      drawing = null;
      renderPreview();
      updateEditorState();
      statusEl.textContent = "已重做一步标注。";
    }

    /* ================================================================
     * 画布坐标换算
     * ================================================================ */
    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x: 0, y: 0 };

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    /* ================================================================
     * 绘制交互
     * ================================================================ */
    function buildAnnotationBase(type) {
      return {
        type,
        color: anno.color.value,
        lineWidth: Number(anno.width.value),
        opacity: Number(anno.opacity.value) / 100,
        fill: anno.fill.checked
      };
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0 && event.pointerType === "mouse") return;
      if (currentTool === "none") return;

      const item = images[selectedIndex];
      if (!item) {
        statusEl.textContent = "请先在右侧选择一张图片。";
        return;
      }

      event.preventDefault();
      const point = getCanvasPoint(event);

      if (currentTool === "text") {
        const content = (anno.text.value || "").trim();
        if (!content) {
          statusEl.textContent = "请先在编辑区输入文字内容。";
          anno.text.focus();
          return;
        }

        item.annotations.push({
          ...buildAnnotationBase("text"),
          text: content,
          fontSize: Number(anno.font.value),
          points: [point]
        });
        item.redo = [];

        renderPreview();
        updateEditorState();
        statusEl.textContent = "已添加文字标注。";
        return;
      }

      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) { /* 忽略 */ }

      drawing = {
        ...buildAnnotationBase(currentTool),
        points: currentTool === "pen" ? [point] : [point, point]
      };

      renderPreview();
    });

    canvas.addEventListener("pointermove", event => {
      if (!drawing) return;
      event.preventDefault();

      const point = getCanvasPoint(event);

      if (drawing.type === "pen") {
        const last = drawing.points[drawing.points.length - 1];
        if (Math.hypot(point.x - last.x, point.y - last.y) < 2) return;
        drawing.points.push(point);
      } else {
        drawing.points[1] = point;
      }

      renderPreview();
    });

    function finishDrawing(event) {
      if (!drawing) return;

      const item = images[selectedIndex];
      const current = drawing;
      drawing = null;

      if (!item) {
        renderPreview();
        return;
      }

      if (event) {
        try {
          canvas.releasePointerCapture(event.pointerId);
        } catch (error) { /* 忽略 */ }
      }

      let valid = true;
      const pts = current.points;

      if (current.type === "pen") {
        valid = pts.length > 1;
      } else {
        const dx = pts[1].x - pts[0].x;
        const dy = pts[1].y - pts[0].y;
        valid = Math.hypot(dx, dy) > 4;
      }

      if (valid) {
        item.annotations.push(current);
        item.redo = [];
        statusEl.textContent = "已添加标注，可用「撤销」回退。";
      }

      renderPreview();
      updateEditorState();
    }

    canvas.addEventListener("pointerup", finishDrawing);
    canvas.addEventListener("pointercancel", () => {
      drawing = null;
      renderPreview();
    });

    /* ================================================================
     * 编辑区控件绑定
     * ================================================================ */
    editorTools.addEventListener("click", event => {
      const btn = event.target.closest("[data-tool]");
      if (!btn) return;
      setTool(btn.dataset.tool);
    });

    undoBtn.addEventListener("click", undoAnnotation);
    redoBtn.addEventListener("click", redoAnnotation);

    clearAnnoBtn.addEventListener("click", () => {
      const item = images[selectedIndex];
      if (!item || !item.annotations.length) return;
      item.annotations = [];
      item.redo = [];
      drawing = null;
      renderPreview();
      updateEditorState();
      statusEl.textContent = "已清除当前图片的全部标注。";
    });

    document.querySelectorAll("#annoSwatches [data-color]").forEach(btn => {
      btn.addEventListener("click", () => {
        anno.color.value = btn.dataset.color;
        document.querySelectorAll("#annoSwatches [data-color]").forEach(item => {
          item.classList.toggle("active", item === btn);
        });
      });
    });

    anno.color.addEventListener("input", () => {
      document.querySelectorAll("#annoSwatches [data-color]").forEach(item => {
        item.classList.toggle("active", item.dataset.color === anno.color.value);
      });
    });

    [anno.width, anno.font, anno.opacity].forEach(input => {
      input.addEventListener("input", updateAnnoLabels);
    });

    /* ================================================================
     * 快捷键
     * ================================================================ */
    window.addEventListener("keydown", event => {
      const target = event.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "SELECT" ||
                     target.tagName === "TEXTAREA")) {
        return;
      }

      const mod = event.ctrlKey || event.metaKey;

      if (mod && event.key.toLowerCase() === "z") {
        event.preventDefault();
        if (event.shiftKey) redoAnnotation();
        else undoAnnotation();
        return;
      }

      if (mod && event.key.toLowerCase() === "y") {
        event.preventDefault();
        redoAnnotation();
        return;
      }

      const map = {
        "1": "rect", "2": "ellipse", "3": "arrow", "4": "line",
        "5": "pen", "6": "mosaic", "7": "text", "0": "none"
      };
      if (map[event.key]) {
        event.preventDefault();
        setTool(map[event.key]);
      }
    });

    /* ================================================================
     * 进度条
     * ================================================================ */
    function showProgress(percent) {
      progressEl.hidden = false;
      progressBar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function hideProgress() {
      progressEl.hidden = true;
      progressBar.style.width = "0";
    }

    /* ================================================================
     * 添加图片
     * ================================================================ */
    function addFiles(list) {
      const files = [...list].filter(file => file.type.startsWith("image/"));
      if (!files.length) {
        statusEl.textContent = "没有找到可用的图片文件。";
        return;
      }

      let loaded = 0;
      let failed = 0;

      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          images.push({
            file,
            image,
            url,
            annotations: [],
            redo: []
          });

          if (selectedIndex < 0) selectedIndex = 0;

          renderList();
          renderPreview();
          updateCount();
          updateActionButtons();
          updateEditorState();

          loaded++;
          statusEl.textContent = `已添加 ${loaded} / ${files.length} 张图片`;
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          failed++;
          statusEl.textContent = `有 ${failed} 个文件无法读取。`;
        };

        image.src = url;
      });
    }

    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      fileInput.value = "";
    });

    /* ================================================================
     * 拖拽 / 粘贴
     * ================================================================ */
    ["dragenter", "dragover"].forEach(type => {
      dropZone.addEventListener(type, event => {
        event.preventDefault();
        dropZone.classList.add("drag-over");
      });
    });

    ["dragleave", "dragend"].forEach(type => {
      dropZone.addEventListener(type, () => dropZone.classList.remove("drag-over"));
    });

    dropZone.addEventListener("drop", event => {
      event.preventDefault();
      dropZone.classList.remove("drag-over");
      addFiles(event.dataTransfer.files);
    });

    window.addEventListener("dragover", event => event.preventDefault());
    window.addEventListener("drop", event => event.preventDefault());

    window.addEventListener("paste", event => {
      const files = [...(event.clipboardData?.files || [])];
      if (files.length) addFiles(files);
    });

    /* ================================================================
     * 水印控件绑定
     * ================================================================ */
    Object.values(controls).forEach(control => {
      control.addEventListener("input", () => {
        updateLabels();
        renderPreview();
      });
    });

    qualityRange.addEventListener("input", updateLabels);

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        spacingField.hidden   = mode !== "tile";
        singlePosField.hidden = mode !== "single";
        renderPreview();
      });
    });

    document.querySelectorAll("[data-pos]").forEach(button => {
      button.addEventListener("click", () => {
        position = button.dataset.pos;
        document.querySelectorAll("[data-pos]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        renderPreview();
      });
    });

    formatSelect.addEventListener("input", () => {
      qualityField.hidden = formatSelect.value === "image/png";
    });

    /* ================================================================
     * 复制到剪贴板
     * ================================================================ */
    function itemToPngBlob(item) {
      const output = document.createElement("canvas");
      drawWatermark(output, item.image, { annotations: item.annotations });
      return new Promise((resolve, reject) => {
        output.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error("图片生成失败。"));
        }, "image/png");
      });
    }

    async function copyCurrent() {
      const item = images[selectedIndex];
      if (!item) {
        statusEl.textContent = "请先在右侧列表中选择一张图片。";
        return;
      }

      try {
        statusEl.textContent = "正在生成图片…";
        const blob = await itemToPngBlob(item);
        await Desktop.copyImage(blob);
        statusEl.textContent = `已复制「${item.file.name}」（PNG）。`;
      } catch (error) {
        statusEl.textContent = error.message || "复制失败，请重试。";
      }
    }

    copyOneBtn.addEventListener("click", copyCurrent);
    copyOneMini.addEventListener("click", copyCurrent);

    /* ================================================================
     * 长图拼接
     * ================================================================ */
    function getStitchOptions() {
      return {
        dir: stitchDir,
        uniform: stitchFit === "uniform",
        gap: Number(stitchGap.value),
        bg: stitchBg.value,
        withDecor: stitchWatermark.checked
      };
    }

    function estimateStitchSize() {
      if (!images.length) return null;

      const { dir, uniform, gap } = getStitchOptions();
      const n = images.length;
      const dims = images.map(it => ({
        w: it.image.naturalWidth,
        h: it.image.naturalHeight
      }));

      if (dir === "vertical") {
        const totalW = Math.max(...dims.map(d => d.w));
        let totalH = 0;
        dims.forEach(d => {
          totalH += uniform ? Math.round(d.h * totalW / d.w) : d.h;
        });
        totalH += gap * (n - 1);
        return { w: totalW, h: totalH };
      }

      const totalH = Math.max(...dims.map(d => d.h));
      let totalW = 0;
      dims.forEach(d => {
        totalW += uniform ? Math.round(d.w * totalH / d.h) : d.w;
      });
      totalW += gap * (n - 1);
      return { w: totalW, h: totalH };
    }

    function isStitchOverLimit(w, h) {
      return w > STITCH_MAX_DIM || h > STITCH_MAX_DIM || w * h > STITCH_MAX_AREA;
    }

    function updateStitchInfo() {
      const hasImages = images.length > 0;
      stitchExportBtn.disabled = !hasImages;
      stitchCopyBtn.disabled   = !hasImages;

      const size = estimateStitchSize();

      if (!size) {
        stitchInfoEl.textContent = "—";
        stitchHintEl.textContent = "选择图片后自动估算长图尺寸。";
        stitchHintEl.style.color = "";
        return;
      }

      stitchInfoEl.textContent = `${size.w} × ${size.h}`;

      if (isStitchOverLimit(size.w, size.h)) {
        stitchHintEl.textContent = "⚠ 超出浏览器画布上限，请减少图片数量或间距。";
        stitchHintEl.style.color = "#ff7b7b";
      } else {
        const mp = (size.w * size.h / 1e6).toFixed(1);
        stitchHintEl.textContent = `约 ${mp} 百万像素，可正常导出。`;
        stitchHintEl.style.color = "";
      }
    }

    async function buildStitchCanvas(onProgress) {
      const { dir, uniform, gap, bg, withDecor } = getStitchOptions();
      const n = images.length;
      if (!n) throw new Error("请先选择图片。");

      const rendered = [];
      for (let i = 0; i < n; i++) {
        const item = images[i];
        const c = document.createElement("canvas");

        if (withDecor) {
          drawWatermark(c, item.image, { annotations: item.annotations });
        } else {
          c.width  = item.image.naturalWidth;
          c.height = item.image.naturalHeight;
          c.getContext("2d").drawImage(item.image, 0, 0);
        }

        rendered.push(c);

        if (onProgress) onProgress((i + 1) / n * 0.6);
        statusEl.textContent = `正在渲染 ${i + 1} / ${n}`;
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      const baseDim = dir === "vertical"
        ? Math.max(...rendered.map(c => c.width))
        : Math.max(...rendered.map(c => c.height));

      const scaled = rendered.map(c => {
        if (!uniform) return { canvas: c, w: c.width, h: c.height };
        if (dir === "vertical") {
          return {
            canvas: c,
            w: baseDim,
            h: Math.max(1, Math.round(c.height * baseDim / c.width))
          };
        }
        return {
          canvas: c,
          w: Math.max(1, Math.round(c.width * baseDim / c.height)),
          h: baseDim
        };
      });

      let totalW, totalH;
      if (dir === "vertical") {
        totalW = baseDim;
        totalH = scaled.reduce((sum, s) => sum + s.h, 0) + gap * (n - 1);
      } else {
        totalH = baseDim;
        totalW = scaled.reduce((sum, s) => sum + s.w, 0) + gap * (n - 1);
      }

      if (isStitchOverLimit(totalW, totalH)) {
        throw new Error(
          `拼接结果 ${totalW}×${totalH} 超出浏览器画布上限，` +
          `请减少图片数量、间距，或改用「保持原尺寸」。`
        );
      }

      statusEl.textContent = "正在拼接长图…";
      const out = document.createElement("canvas");
      out.width  = totalW;
      out.height = totalH;

      const ctx = out.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, totalW, totalH);

      let offset = 0;
      for (const s of scaled) {
        if (dir === "vertical") {
          const x = Math.round((totalW - s.w) / 2);
          ctx.drawImage(s.canvas, x, offset, s.w, s.h);
          offset += s.h + gap;
        } else {
          const y = Math.round((totalH - s.h) / 2);
          ctx.drawImage(s.canvas, offset, y, s.w, s.h);
          offset += s.w + gap;
        }
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      if (onProgress) onProgress(1);
      return out;
    }

    async function exportStitch() {
      if (!images.length) {
        statusEl.textContent = "请先选择图片。";
        return;
      }

      stitchExportBtn.disabled = true;
      stitchCopyBtn.disabled = true;
      showProgress(0);

      try {
        const out = await buildStitchCanvas(p => showProgress(p * 70));
        const settings = getExportSettings();

        statusEl.textContent = "正在导出长图…";
        const blob = await new Promise(resolve =>
          out.toBlob(resolve, settings.type, settings.quality)
        );
        if (!blob) throw new Error("长图生成失败，可能超出浏览器限制。");

        showProgress(100);
        const date = new Date().toISOString().slice(0, 10);
        const fileName = `stitched-${date}.${settings.ext}`;

        if (Desktop.isNative) {
          await Desktop.saveBlob(blob, fileName, settings.ext);
        } else {
          triggerBrowserDownload(blob, fileName);
        }

        statusEl.textContent = `已导出长图：${out.width} × ${out.height}（${settings.ext.toUpperCase()}）`;
      } catch (error) {
        statusEl.textContent = error.message || "拼接失败，请重试。";
      } finally {
        stitchExportBtn.disabled = false;
        updateStitchInfo();
        setTimeout(hideProgress, 800);
      }
    }

    async function copyStitch() {
      if (!images.length) {
        statusEl.textContent = "请先选择图片。";
        return;
      }

      stitchExportBtn.disabled = true;
      stitchCopyBtn.disabled = true;
      showProgress(0);

      try {
        const out = await buildStitchCanvas(p => showProgress(p * 70));

        statusEl.textContent = "正在复制长图到剪贴板…";
        const blob = await new Promise(resolve => out.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("长图生成失败，可能超出浏览器限制。");

        showProgress(100);
        await Desktop.copyImage(blob);
        statusEl.textContent = `已复制长图到剪贴板：${out.width} × ${out.height}`;
      } catch (error) {
        statusEl.textContent = error.message || "复制失败，请重试。";
      } finally {
        stitchExportBtn.disabled = false;
        updateStitchInfo();
        setTimeout(hideProgress, 800);
      }
    }

    stitchExportBtn.addEventListener("click", exportStitch);
    stitchCopyBtn.addEventListener("click", copyStitch);

    document.querySelectorAll("[data-stitch-dir]").forEach(button => {
      button.addEventListener("click", () => {
        stitchDir = button.dataset.stitchDir;
        document.querySelectorAll("[data-stitch-dir]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        updateStitchInfo();
      });
    });

    document.querySelectorAll("[data-stitch-fit]").forEach(button => {
      button.addEventListener("click", () => {
        stitchFit = button.dataset.stitchFit;
        document.querySelectorAll("[data-stitch-fit]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        updateStitchInfo();
      });
    });

    stitchGap.addEventListener("input", () => {
      updateLabels();
      updateStitchInfo();
    });

    stitchBg.addEventListener("input", updateStitchInfo);
    stitchWatermark.addEventListener("change", updateStitchInfo);

    /* ================================================================
     * 导出方式
     * ================================================================ */
    document.querySelectorAll("[data-export]").forEach(button => {
      button.addEventListener("click", () => {
        exportMode = button.dataset.export;
        document.querySelectorAll("[data-export]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        folderField.hidden = exportMode !== "folder";
        downloadBtn.textContent = exportMode === "folder"
          ? "保存到文件夹"
          : "下载全部 ZIP";
      });
    });

    /* ================================================================
     * 文件夹选择（浏览器 / 桌面双路径）
     * ================================================================ */
    pickFolderBtn.addEventListener("click", async () => {
      if (Desktop.isNative) {
        try {
          const path = await Desktop.pickFolder();
          if (!path) return;
          nativeFolderPath = path;
          directoryHandle = null;
          folderNameEl.textContent = `📁 ${path}`;
          folderNameEl.classList.add("active");
          statusEl.textContent = `已选择文件夹：${path}`;
        } catch (error) {
          statusEl.textContent = `选择文件夹失败：${error.message}`;
        }
        return;
      }

      if (!supportsFolderPicker) {
        statusEl.textContent = "当前浏览器不支持文件夹访问，请使用 ZIP 下载或桌面版。";
        return;
      }

      try {
        directoryHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        nativeFolderPath = null;
        folderNameEl.textContent = `📁 ${directoryHandle.name}`;
        folderNameEl.classList.add("active");
        statusEl.textContent = `已选择文件夹：${directoryHandle.name}`;
      } catch (error) {
        if (error.name !== "AbortError") {
          statusEl.textContent = `选择文件夹失败：${error.message}`;
        }
      }
    });

    async function ensurePermission() {
      if (!directoryHandle) return false;
      const opts = { mode: "readwrite" };
      if (await directoryHandle.queryPermission(opts) === "granted") return true;
      return (await directoryHandle.requestPermission(opts)) === "granted";
    }

    /* ================================================================
     * 文件名模板
     * ================================================================ */
    function buildName(template, originalName, index) {
      const base = (originalName || "").replace(/\.[^.]+$/, "") || `image-${index + 1}`;
      const date = new Date().toISOString().slice(0, 10);

      const result = (template || "{name}")
        .replace(/\{name\}/gi, base)
        .replace(/\{index\}/gi, String(index + 1).padStart(2, "0"))
        .replace(/\{date\}/gi, date)
        .replace(/[\\/:*?"<>|]/g, "_")
        .trim();

      return result || base;
    }

    /* ================================================================
     * 导出工具
     * ================================================================ */
    function getExportSettings() {
      const type = formatSelect.value;
      return {
        type,
        ext: EXT[type] || "png",
        quality: Number(qualityRange.value) / 100,
        background: type === "image/jpeg" ? "#ffffff" : null
      };
    }

    async function renderBlob(item, settings) {
      const output = document.createElement("canvas");
      drawWatermark(output, item.image, {
        background: settings.background,
        annotations: item.annotations
      });

      const blob = await new Promise(resolve =>
        output.toBlob(resolve, settings.type, settings.quality)
      );
      if (!blob) throw new Error("图片生成失败");
      return blob;
    }

    function triggerBrowserDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ================================================================
     * 下载当前图片
     * ================================================================ */
    async function downloadCurrent() {
      const item = images[selectedIndex];
      if (!item) {
        statusEl.textContent = "请先在右侧列表中选择一张图片。";
        return;
      }

      const settings = getExportSettings();
      try {
        statusEl.textContent = "正在生成当前图片…";
        const blob = await renderBlob(item, settings);
        const baseName = buildName(namingInput.value, item.file.name, selectedIndex);
        const fileName = `${baseName}.${settings.ext}`;

        if (Desktop.isNative) {
          await Desktop.saveBlob(blob, fileName, settings.ext);
        } else {
          triggerBrowserDownload(blob, fileName);
        }

        statusEl.textContent = `已导出：${fileName}`;
      } catch (error) {
        statusEl.textContent = error.message || "导出失败，请重试。";
      }
    }

    downloadOneBtn.addEventListener("click", downloadCurrent);
    downloadOneMini.addEventListener("click", downloadCurrent);

    /* ================================================================
     * 批量导出：ZIP
     * ================================================================ */
    async function exportToZip(settings) {
      if (typeof JSZip === "undefined") {
        throw new Error("压缩组件加载失败，请检查网络连接后重试。");
      }

      const zip = new JSZip();
      const usedNames = new Set();

      for (let i = 0; i < images.length; i++) {
        statusEl.textContent = `正在处理 ${i + 1} / ${images.length}`;
        showProgress((i / images.length) * 70);
        await new Promise(resolve => setTimeout(resolve, 0));

        const item = images[i];
        const blob = await renderBlob(item, settings);

        const baseName = buildName(namingInput.value, item.file.name, i);
        let name = `${baseName}.${settings.ext}`;
        let suffix = 2;
        while (usedNames.has(name)) {
          name = `${baseName}-${suffix++}.${settings.ext}`;
        }
        usedNames.add(name);
        zip.file(name, blob);
      }

      const blob = await zip.generateAsync({ type: "blob" }, meta => {
        statusEl.textContent = `正在压缩 ${Math.round(meta.percent)}%`;
        showProgress(70 + meta.percent * 0.3);
      });

      const zipName = "watermarked-images.zip";

      if (Desktop.isNative) {
        await Desktop.saveBlob(blob, zipName, "zip");
      } else {
        triggerBrowserDownload(blob, zipName);
      }

      statusEl.textContent = `已打包 ${images.length} 张图片（${settings.ext.toUpperCase()}）`;
    }

    /* ================================================================
     * 批量导出：文件夹
     * ================================================================ */
    async function fileExistsInFolder(name, usedNames) {
      if (usedNames.has(name)) return true;
      if (!directoryHandle) return false;
      try {
        await directoryHandle.getFileHandle(name);
        return true;
      } catch {
        return false;
      }
    }

    async function writeFileToFolder(name, blob) {
      const fileHandle = await directoryHandle.getFileHandle(name, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    async function exportToFolder(settings) {
      const useNative = Desktop.isNative && nativeFolderPath;

      if (!useNative && !directoryHandle) {
        throw new Error("请先选择导出文件夹。");
      }
      if (!useNative && !await ensurePermission()) {
        throw new Error("没有该文件夹的写入权限。");
      }

      const usedNames = new Set();

      for (let i = 0; i < images.length; i++) {
        statusEl.textContent = `正在保存 ${i + 1} / ${images.length}`;
        showProgress((i / images.length) * 100);
        await new Promise(resolve => setTimeout(resolve, 0));

        const item = images[i];
        const blob = await renderBlob(item, settings);

        const baseName = buildName(namingInput.value, item.file.name, i);
        let name = `${baseName}.${settings.ext}`;
        let suffix = 2;
        while (await fileExistsInFolder(name, usedNames)) {
          name = `${baseName}-${suffix++}.${settings.ext}`;
        }
        usedNames.add(name);

        if (useNative) {
          await Desktop.writeToFolder(nativeFolderPath, name, blob);
        } else {
          await writeFileToFolder(name, blob);
        }
      }

      showProgress(100);
      statusEl.textContent = `已保存 ${images.length} 张图片`;
    }

    /* ================================================================
     * 批量导出入口
     * ================================================================ */
    downloadBtn.addEventListener("click", async () => {
      if (!images.length) {
        statusEl.textContent = "请先选择图片。";
        return;
      }

      const settings = getExportSettings();
      downloadBtn.disabled = true;

      try {
        if (exportMode === "folder") {
          await exportToFolder(settings);
        } else {
          await exportToZip(settings);
        }
      } catch (error) {
        statusEl.textContent = error.message || "导出失败，请重试。";
      } finally {
        downloadBtn.disabled = false;
        setTimeout(hideProgress, 600);
      }
    });

    /* ================================================================
     * 清空
     * ================================================================ */
    document.querySelector("#clear").addEventListener("click", () => {
      images.forEach(item => URL.revokeObjectURL(item.url));
      images.length = 0;
      selectedIndex = -1;
      drawing = null;
      fileList.replaceChildren();
      canvas.style.display = "none";
      emptyHint.hidden = false;
      updateCount();
      updateActionButtons();
      updateEditorState();
      statusEl.textContent = "";
      hideProgress();
    });

    /* ================================================================
     * 初始化
     * ================================================================ */
    updateLabels();
    updateAnnoLabels();
    qualityField.hidden   = formatSelect.value === "image/png";
    spacingField.hidden   = mode !== "tile";
    singlePosField.hidden = mode !== "single";
    folderField.hidden    = exportMode !== "folder";
    document.querySelector('[data-tool="none"]').classList.add("active");
    setTool("none");
    updateActionButtons();
    updateEditorState();

    if (!Desktop.isNative && !supportsFolderPicker) {
      const folderBtn = document.querySelector('[data-export="folder"]');
      folderBtn.disabled = true;
      folderBtn.title = "当前浏览器不支持文件夹访问";
      folderBtn.style.opacity = ".5";
      folderBtn.style.cursor = "not-allowed";
    }
  </script>

  <!-- PWA：注册 Service Worker（file:// 与桌面壳内跳过） -->
  <script>
    const inTauriShell =
      location.protocol === "tauri:" || location.hostname.endsWith("tauri.localhost");

    if (!inTauriShell && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service Worker 注册失败：", err);
        });
      });
    }
  </script>
</body>
