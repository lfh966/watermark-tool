name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查静态文件
        run: |
          test -f src/index.html
          test -f src/manifest.json
          test -f src/sw.js
          test -f src/vendor/jszip.min.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传 src 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
